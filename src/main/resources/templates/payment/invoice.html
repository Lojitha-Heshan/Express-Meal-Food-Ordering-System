<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Invoice - ExpressMeal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f7f5f2;">
<div class="container my-5" style="max-width:500px;">
    <div class="card p-4 shadow-sm">
        <h4 class="text-success mb-3">✅ Payment Successful</h4>
        <p>Invoice for Order #<span th:text="${order.orderId}"></span></p>
        <hr>
        <p>Amount Paid: <strong>Rs. <span th:text="${payment.amount}"></span></strong></p>
        <p>Method: <span th:text="${payment.method}"></span></p>
        <p>Status: <span class="badge bg-success" th:text="${payment.status}"></span></p>
        <a th:href="@{/order/track/{id}(id=${order.orderId})}" class="btn btn-warning mt-3">Track My Order</a>
    </div>
</div>
</body>
</html>
