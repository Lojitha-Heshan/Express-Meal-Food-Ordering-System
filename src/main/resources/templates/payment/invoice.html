<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Invoice - ExpressMeal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        *{font-family:'Poppins',sans-serif;}
        .card{border:none; border-radius:18px; box-shadow:0 8px 24px rgba(0,0,0,.06);}
        .btn-orange{background:#FF6B35; border:none; color:#fff; border-radius:50px; font-weight:600; transition:.2s;}
        .btn-orange:hover{background:#e85a2a; color:#fff;}
        .icon-circle{width:56px; height:56px; border-radius:50%; background:#e8f8ee; color:#22c55e; display:flex; align-items:center; justify-content:center; font-size:1.4rem; margin-bottom:14px;}
    </style>
</head>
<body style="background:#FFF8F2;">
<div class="container my-5" style="max-width:500px;">
    <div class="card p-4">
        <div class="icon-circle"><i class="bi bi-check-lg"></i></div>
        <h4 class="fw-bold mb-3">Payment Successful</h4>
        <p class="text-muted mb-1">Invoice for Order #<span th:text="${order.orderId}"></span></p>
        <hr>
        <p>Subtotal: Rs. <span th:text="${payment.amount}"></span></p>
        <p th:if="${payment.deliveryFee != null and payment.deliveryFee > 0}">Delivery Fee: Rs. <span th:text="${payment.deliveryFee}"></span></p>
        <p th:if="${payment.processingFee != null and payment.processingFee > 0}">Card Processing Fee (2%): Rs. <span th:text="${payment.processingFee}"></span></p>
        <hr>
        <p>Amount Paid: <strong>Rs. <span th:text="${payment.amount + (payment.deliveryFee != null ? payment.deliveryFee : 0) + (payment.processingFee != null ? payment.processingFee : 0)}"></span></strong></p>
        <p>Method: <span th:text="${payment.method}"></span></p>
        <p>Status: <span class="badge bg-success rounded-pill" th:text="${payment.status}"></span></p>
        <a th:href="@{/order/track/{id}(id=${order.orderId})}" class="btn btn-orange mt-3"><i class="bi bi-geo-alt-fill"></i> Track My Order</a>
    </div>
</div>
</body>
</html>
