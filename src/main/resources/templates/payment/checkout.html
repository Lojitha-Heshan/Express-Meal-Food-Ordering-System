<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Checkout - ExpressMeal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f7f5f2;">
<div class="container my-5" style="max-width:450px;">
    <div class="card p-4 shadow-sm">
        <h4 class="mb-3">Payment</h4>
        <p>Order #<span th:text="${order.orderId}"></span></p>
        <h5 class="mb-3">Total: Rs. <span th:text="${order.totalAmount}"></span></h5>
        <form th:action="@{/payment/pay}" method="post">
            <input type="hidden" name="orderId" th:value="${order.orderId}" />
            <label class="form-label">Payment Method</label>
            <select name="method" class="form-select mb-3">
                <option value="CARD">Card (simulated)</option>
                <option value="CASH_ON_DELIVERY">Cash on Delivery</option>
            </select>
            <button type="submit" class="btn btn-warning w-100">Pay Now</button>
        </form>
    </div>
</div>
</body>
</html>
