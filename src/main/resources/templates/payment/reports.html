<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Sales Report - ExpressMeal Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f7f5f2;">
<div class="container my-5">
    <h3 class="mb-4">Sales Report</h3>
    <div class="card p-4 shadow-sm mb-4" style="max-width:300px;">
        <h6 class="text-muted">Total Revenue</h6>
        <h2 class="text-success">Rs. <span th:text="${totalRevenue}"></span></h2>
    </div>
    <table class="table bg-white shadow-sm rounded">
        <thead class="table-light"><tr><th>Order #</th><th>Amount</th><th>Method</th><th>Status</th><th>Date</th></tr></thead>
        <tbody>
        <tr th:each="p : ${payments}">
            <td th:text="${p.order.orderId}"></td>
            <td th:text="${p.amount}"></td>
            <td th:text="${p.method}"></td>
            <td th:text="${p.status}"></td>
            <td th:text="${#temporals.format(p.paidAt, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
