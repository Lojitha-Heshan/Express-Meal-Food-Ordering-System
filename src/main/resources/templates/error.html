<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Something went wrong - ExpressMeal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        *{font-family:'Poppins',sans-serif;}
        body{background:#FFF8F2; min-height:100vh; display:flex; align-items:center; justify-content:center;}
        .error-card{background:#fff; border-radius:20px; padding:44px; box-shadow:0 10px 30px rgba(0,0,0,.06); max-width:480px; text-align:center;}
        .error-icon{width:72px; height:72px; border-radius:50%; background:#fff0e8; color:#FF6B35; display:flex; align-items:center; justify-content:center; font-size:2rem; margin:0 auto 18px;}
        .status-code{font-size:.85rem; color:#bbb; letter-spacing:1px; font-weight:600;}
        .btn-home{background:#FF6B35; border:none; color:#fff; border-radius:50px; font-weight:600; padding:10px 28px;}
        .btn-home:hover{background:#e85a2a; color:#fff;}
        .error-detail{background:#FFF8F2; border-radius:10px; padding:12px 14px; font-size:.78rem; color:#999; text-align:left; margin-top:18px; word-break:break-word;}
    </style>
</head>
<body>
<div class="error-card">
    <div class="error-icon"><i class="bi bi-emoji-frown"></i></div>
    <p class="status-code mb-1" th:text="'ERROR ' + ${status ?: '—'}"></p>
    <h4 class="fw-bold mb-2">Something went wrong</h4>
    <p class="text-muted mb-4">
        Sorry about that — this wasn't supposed to happen. Try going back, or head to the homepage and start again.
    </p>
    <a href="/" class="btn btn-home"><i class="bi bi-house-fill"></i> Go to homepage</a>

    <div class="error-detail" th:if="${message != null and !#strings.isEmpty(message)}">
        <strong>Detail:</strong> <span th:text="${message}"></span>
    </div>
</div>
</body>
</html>
