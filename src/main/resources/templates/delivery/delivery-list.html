<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Deliveries - ExpressMeal Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f7f5f2;">
<div class="container my-5">
    <h3 class="mb-4">All Deliveries</h3>
    <table class="table bg-white shadow-sm rounded">
        <thead class="table-light"><tr><th>Order #</th><th>Customer</th><th>Address</th><th>Rider</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="d : ${deliveries}">
            <td th:text="${d.order.orderId}"></td>
            <td th:text="${d.order.customer.name} + ' (' + ${d.order.customer.phone} + ')'"></td>
            <td th:text="${d.order.deliveryAddress}"></td>
            <td th:text="${d.rider != null ? d.rider.name : 'Not Assigned'}"></td>
            <td><span class="badge bg-info text-dark" th:text="${d.deliveryStatus}"></span></td>
            <td>
                <a th:if="${d.deliveryStatus == 'PENDING'}" th:href="@{/delivery/assign/{id}(id=${d.deliveryId})}" class="btn btn-sm btn-outline-primary">Assign Rider</a>

                <form th:if="${d.deliveryStatus == 'ASSIGNED'}" th:action="@{/delivery/{id}/update-status(id=${d.deliveryId})}" method="post" class="d-inline">
                    <input type="hidden" name="status" value="PICKED_UP">
                    <button type="submit" class="btn btn-sm btn-outline-warning">Mark Picked Up</button>
                </form>
                <form th:if="${d.deliveryStatus == 'PICKED_UP'}" th:action="@{/delivery/{id}/update-status(id=${d.deliveryId})}" method="post" class="d-inline">
                    <input type="hidden" name="status" value="IN_TRANSIT">
                    <button type="submit" class="btn btn-sm btn-outline-warning">Start Transit</button>
                </form>
                <form th:if="${d.deliveryStatus == 'IN_TRANSIT'}" th:action="@{/delivery/{id}/update-status(id=${d.deliveryId})}" method="post" class="d-inline">
                    <input type="hidden" name="status" value="DELIVERED">
                    <button type="submit" class="btn btn-sm btn-outline-success">Mark Delivered</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
