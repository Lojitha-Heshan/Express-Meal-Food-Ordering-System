<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Riders - QuickBite Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f7f5f2;">
<div class="container my-5">
    <div class="d-flex justify-content-between mb-4">
        <h3>Delivery Riders</h3>
        <a th:href="@{/delivery/riders/new}" class="btn btn-warning">+ Register Rider</a>
    </div>
    <table class="table bg-white shadow-sm rounded">
        <thead class="table-light"><tr><th>Name</th><th>Phone</th><th>Vehicle</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="r : ${riders}">
            <td th:text="${r.name}"></td>
            <td th:text="${r.phoneNumber}"></td>
            <td th:text="${r.vehicleNumber}"></td>
            <td><span class="badge bg-info text-dark" th:text="${r.status}"></span></td>
            <td>
                <a th:href="@{/delivery/riders/edit/{id}(id=${r.riderId})}" class="btn btn-sm btn-outline-primary">Edit</a>
                <a th:href="@{/delivery/riders/delete/{id}(id=${r.riderId})}" class="btn btn-sm btn-outline-danger">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
