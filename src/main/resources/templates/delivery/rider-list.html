<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Riders - ExpressMeal Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        *{font-family:'Poppins',sans-serif;}
        body{background:#FFF8F2;}
        .navbar{background:#1C1C1E;}
        .brand span{color:#FF6B35;}
        .btn-orange{background:#FF6B35; border:none; color:#fff; border-radius:50px; font-weight:600;}
        .btn-orange:hover{background:#e85a2a; color:#fff;}
        .card{border:none; border-radius:16px;}
        table thead{background:#FFF8F2;}
        .badge-status{border-radius:30px; padding:5px 12px; font-weight:600; font-size:.75rem;}
    </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand brand fw-bold"><i class="bi bi-shield-lock-fill me-1"></i>Express<span>Meal</span> Admin</span>
    <div>
        <a th:href="@{/admin/dashboard}" class="btn btn-outline-light btn-sm rounded-pill me-2"><i class="bi bi-arrow-left"></i> Dashboard</a>
        <a th:href="@{/logout}" class="btn btn-orange btn-sm">Logout</a>
    </div>
</nav>

<div class="container my-5">
    <div class="alert alert-success toast-msg" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger toast-msg" th:if="${error}" th:text="${error}"></div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Delivery Riders</h3>
        <a th:href="@{/delivery/riders/new}" class="btn btn-orange"><i class="bi bi-plus-lg"></i> Register Rider</a>
    </div>
    <div class="card shadow-sm p-0">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th class="ps-4">Name</th><th>Phone</th><th>Vehicle</th><th>Status</th><th class="pe-4 text-end">Actions</th></tr></thead>
                <tbody>
                <tr th:each="r : ${riders}">
                    <td class="ps-4 fw-semibold" th:text="${r.name}"></td>
                    <td th:text="${r.phoneNumber}"></td>
                    <td th:text="${r.vehicleNumber}"></td>
                    <td><span class="badge-status bg-light text-dark" th:text="${r.status}"></span></td>
                    <td class="pe-4 text-end">
                        <a th:href="@{/delivery/riders/edit/{id}(id=${r.riderId})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i> Edit</a>
                        <a th:href="@{/delivery/riders/delete/{id}(id=${r.riderId})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this rider?');"><i class="bi bi-trash"></i> Delete</a>
                    </td>
                </tr>
                <tr th:if="${riders.isEmpty()}">
                    <td colspan="5" class="text-center text-muted py-5">No riders registered yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script>
    document.querySelectorAll('.toast-msg').forEach(el => {
        setTimeout(() => { el.style.transition = 'opacity .4s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 400); }, 3500);
    });
</script>
</body>
</html>
