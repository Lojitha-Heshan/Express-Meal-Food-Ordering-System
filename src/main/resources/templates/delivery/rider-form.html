<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Rider Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f7f5f2;">
<div class="container my-5" style="max-width:450px;">
    <h3 class="mb-4">Rider Details</h3>
    <form th:action="@{/delivery/riders/save}" th:object="${rider}" method="post" class="card p-4 shadow-sm">
        <input type="hidden" th:field="*{riderId}" />
        <div class="mb-3"><label class="form-label">Name</label><input class="form-control" th:field="*{name}" required></div>
        <div class="mb-3"><label class="form-label">Phone Number</label><input class="form-control" th:field="*{phoneNumber}" required></div>
        <div class="mb-3"><label class="form-label">Vehicle Number</label><input class="form-control" th:field="*{vehicleNumber}"></div>
        <div class="mb-3">
            <label class="form-label">Login Password (share this with the rider)</label>
            <input class="form-control" th:field="*{password}">
            <small class="text-muted">Default is "rider123" if left unchanged. The rider logs in with their phone number + this password.</small>
        </div>
        <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" th:field="*{status}">
                <option value="AVAILABLE">Available</option>
                <option value="ON_DELIVERY">On Delivery</option>
                <option value="OFFLINE">Offline</option>
            </select>
        </div>
        <button type="submit" class="btn btn-warning">Save</button>
    </form>
</div>
</body>
</html>
