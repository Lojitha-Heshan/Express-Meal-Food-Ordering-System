<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Assign Rider - ExpressMeal Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        *{font-family:'Poppins',sans-serif;}
        body{background:#FFF8F2;}
        .navbar{background:#1C1C1E;}
        .brand span{color:#FF6B35;}
        .btn-orange{background:#FF6B35; border:none; color:#fff; border-radius:50px; font-weight:600;}
        .btn-orange:hover{background:#e85a2a; color:#fff;}
        .card{border:none; border-radius:16px; box-shadow:0 4px 16px rgba(0,0,0,.05);}
        .form-select:focus{border-color:#FF6B35; box-shadow:0 0 0 3px rgba(255,107,53,.15);}
    </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand brand fw-bold"><i class="bi bi-shield-lock-fill me-1"></i>Express<span>Meal</span> Admin</span>
    <a th:href="@{/delivery/list}" class="btn btn-outline-light btn-sm rounded-pill"><i class="bi bi-arrow-left"></i> Deliveries</a>
</nav>

<div class="container my-5" style="max-width:480px;">
    <h3 class="mb-4">Assign Rider — Order #<span th:text="${delivery.order.orderId}"></span></h3>
    <form th:action="@{/delivery/assign}" method="post" class="card p-4">
        <input type="hidden" name="deliveryId" th:value="${delivery.deliveryId}" />
        <label class="form-label small fw-semibold">Select Available Rider</label>
        <select name="riderId" class="form-select mb-4">
            <option th:each="r : ${availableRiders}" th:value="${r.riderId}" th:text="${r.name} + ' - ' + ${r.vehicleNumber}"></option>
        </select>
        <div class="d-flex gap-2">
            <a th:href="@{/delivery/list}" class="btn btn-outline-secondary flex-grow-1 rounded-pill">Cancel</a>
            <button type="submit" class="btn btn-orange flex-grow-1">Assign Rider</button>
        </div>
    </form>
</div>
</body>
</html>
