<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Track Delivery - ExpressMeal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        *{font-family:'Poppins',sans-serif;}
        body{background:#FFF8F2;}
        .navbar{background:#1C1C1E;}
        .brand span{color:#FF6B35;}
        .btn-orange{background:#FF6B35; border:none; color:#fff; border-radius:50px; font-weight:600;}
        .btn-orange:hover{background:#e85a2a; color:#fff;}
        .card{border:none; border-radius:16px; box-shadow:0 4px 16px rgba(0,0,0,.05);}
        .steps{list-style:none; padding:0; margin:0;}
        .steps li{padding:10px 0 10px 30px; position:relative; color:#aaa;}
        .steps li.done{color:#198754; font-weight:600;}
        .steps li::before{content:"●"; position:absolute; left:0;}
    </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand brand fw-bold"><i class="bi bi-geo-alt-fill me-1"></i>Express<span>Meal</span></span>
    <a th:href="@{/customer/dashboard}" class="btn btn-outline-light btn-sm rounded-pill"><i class="bi bi-arrow-left"></i> Dashboard</a>
</nav>

<div class="container my-5" style="max-width:500px;">
    <div class="card p-4">
        <h4 class="mb-3">Track Delivery</h4>

        <div th:if="${delivery.rider != null}" class="bg-light rounded-3 p-3 mb-3 small">
            <p class="mb-1"><i class="bi bi-bicycle text-warning"></i> Rider: <strong th:text="${delivery.rider.name}"></strong></p>
            <p class="mb-0"><i class="bi bi-telephone-fill text-warning"></i> <span th:text="${delivery.rider.phoneNumber}"></span></p>
        </div>

        <!-- Dynamic Map Container -->
        <div id="map"
             th:data-address="${delivery.order.deliveryAddress}"
             style="width: 100%; height: 250px; border-radius: 12px; z-index: 1;"
             class="mb-3"></div>

        <ul class="steps mb-3">
            <li th:classappend="${delivery.deliveryStatus != null} ? 'done'">Order Confirmed</li>
            <li th:classappend="${delivery.rider != null} ? 'done'">
                Assigned to Rider
                <span th:if="${delivery.rider != null}" th:text="'(' + ${delivery.rider.name} + ')'"></span>
            </li>
            <li th:classappend="${delivery.deliveryStatus == 'OUT_FOR_DELIVERY' or delivery.deliveryStatus == 'IN_TRANSIT' or delivery.deliveryStatus == 'DELIVERED'} ? 'done'">Out for Delivery</li>
            <li th:classappend="${delivery.deliveryStatus == 'DELIVERED'} ? 'done'">Delivered</li>
        </ul>
        <a th:href="@{/customer/dashboard}" class="btn btn-orange w-100">Back to Dashboard</a>
    </div>
</div>

<!-- Leaflet JS Library -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Clean JS Script with Correct Brackets & Formatting -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        var mapElement = document.getElementById('map');
        if (mapElement) {
            var rawAddress = mapElement.getAttribute('data-address');

            // Default Map Location (Centered around Kandy)
            var map = L.map('map').setView([7.2906, 80.6337], 12);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            if (rawAddress) {
                // Remove extra numbers after '|' and house numbers at the beginning
                var cleanAddress = rawAddress.split('|')[0]
                    .replace(/^[0-9\/\-A-Za-z]+,\s*/, '')
                    .trim();

                fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(cleanAddress + ', Sri Lanka'))
                    .then(function(res) {
                        return res.json();
                    })
                    .then(function(data) {
                        if (data && data.length > 0) {
                            var lat = parseFloat(data[0].lat);
                            var lon = parseFloat(data[0].lon);
                            map.setView([lat, lon], 14);
                            L.marker([lat, lon]).addTo(map)
                                .bindPopup('<b>Delivery Address:</b><br>' + cleanAddress)
                                .openPopup();
                        } else {
                            L.marker([7.2906, 80.6337]).addTo(map)
                                .bindPopup('<b>Delivery Address:</b><br>' + cleanAddress)
                                .openPopup();
                        }
                    })
                    .catch(function() {
                        L.marker([7.2906, 80.6337]).addTo(map);
                    });
            }
        }
    });
</script>

</body>
</html>
