<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Register - ExpressMeal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        *{font-family:'Poppins',sans-serif;}
        body{background:#FFF8F2;}
        .card{border:none; border-radius:16px; box-shadow:0 4px 16px rgba(0,0,0,.05);}
        .brand{font-weight:800; text-align:center; margin-bottom:4px;}
        .brand span{color:#FF6B35;}
        .form-control{border-radius:12px; padding:10px 14px;}
        .form-control:focus{border-color:#FF6B35; box-shadow:0 0 0 3px rgba(255,107,53,.15);}
        .btn-orange{background:#FF6B35; border:none; color:#fff; font-weight:600; border-radius:50px; padding:12px; transition:.2s;}
        .btn-orange:hover{background:#e85a2a; color:#fff;}
        .is-invalid{border-color:#dc3545;}
        .pw-rules{list-style:none; padding:0; margin:8px 0 0; font-size:.8rem;}
        .pw-rules li{color:#999; margin-bottom:2px; transition:.15s;}
        .pw-rules li.ok{color:#198754; font-weight:600;}
        .pw-rules li i{width:14px; display:inline-block;}
        .phone-hint{font-size:.8rem; margin-top:4px; transition:.15s;}
        .phone-hint.ok{color:#198754; font-weight:600;}
        .phone-hint.bad{color:#dc3545;}
    </style>
</head>
<body style="background:#FFF8F2;">
<div class="container d-flex justify-content-center align-items-center py-5" style="min-height:100vh;">
    <div class="card p-4" style="max-width:440px; width:100%;">
        <h3 class="brand">Express<span>Meal</span></h3>
        <p class="text-center text-muted small mb-4">Create your customer account</p>

        <p th:if="${emailError}" class="alert alert-danger py-2 small" th:text="${emailError}"></p>

        <form th:action="@{/customer/register}" th:object="${customer}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Full Name</label>
                <input type="text" class="form-control" th:field="*{name}"
                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Email</label>
                <input type="email" class="form-control" th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Password</label>
                <input type="password" class="form-control" id="passwordInput" th:field="*{password}"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                <ul class="pw-rules" id="pwRules">
                    <li id="ruleLen"><span class="mark">•</span> At least 8 characters</li>
                    <li id="ruleNum"><span class="mark">•</span> At least 1 number</li>
                    <li id="ruleSpecial"><span class="mark">•</span> At least 1 special character (e.g. ! @ # $ % &amp; *)</li>
                </ul>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Phone</label>
                <input type="text" class="form-control" id="phoneInput" th:field="*{phone}" placeholder="10 digits, no spaces"
                       th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''" required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                <div class="phone-hint" id="phoneHint">10 digits only, no spaces or letters.</div>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Address</label>
                <input type="text" class="form-control" th:field="*{address}">
            </div>
            <button type="submit" class="btn btn-orange w-100 mt-2">Sign Up</button>
        </form>
        <p class="text-center small mt-3 mb-0">Already have an account? <a th:href="@{/login}" style="color:#FF6B35; font-weight:600;">Login</a></p>
    </div>
</div>

<script>
    // Live password requirement checklist - purely cosmetic guidance,
    // server-side @Pattern validation on Customer.java still enforces the real rule.
    const pwInput = document.getElementById('passwordInput');
    const ruleLen = document.getElementById('ruleLen');
    const ruleNum = document.getElementById('ruleNum');
    const ruleSpecial = document.getElementById('ruleSpecial');

    function setRule(li, ok) {
        li.classList.toggle('ok', ok);
        li.querySelector('.mark').textContent = ok ? '✓' : '•';
    }

    pwInput.addEventListener('input', () => {
        const val = pwInput.value;
        setRule(ruleLen, val.length >= 8);
        setRule(ruleNum, /[0-9]/.test(val));
        setRule(ruleSpecial, /[!@#$%^&*(),.?":{}|<>_\-]/.test(val));
    });

    // Live phone number hint - server-side @Pattern on Customer.java still enforces the real rule.
    const phoneInput = document.getElementById('phoneInput');
    const phoneHint = document.getElementById('phoneHint');

    phoneInput.addEventListener('input', () => {
        const val = phoneInput.value;
        if (val.length === 0) {
            phoneHint.textContent = '10 digits only, no spaces or letters.';
            phoneHint.className = 'phone-hint';
            return;
        }
        const valid = /^[0-9]{9,15}$/.test(val);
        phoneHint.textContent = valid ? 'Looks good ✓' : 'Digits only, 10 numbers.';
        phoneHint.className = 'phone-hint ' + (valid ? 'ok' : 'bad');
    });
</script>
</body>
</html>
