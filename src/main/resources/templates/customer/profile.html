<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>My Profile - ExpressMeal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    *{font-family:'Poppins',sans-serif;}
    body{background:#FFF8F2;}
    .navbar{background:#1c1c1e;}
    .brand span{color:#FF6B35;}
    .btn-orange{background:#FF6B35; border:none; color:#fff; border-radius:50px; font-weight:600; transition:.2s;}
    .btn-orange:hover{background:#e85a2a; color:#fff;}
    .btn-orange:disabled{background:#ffb69a; cursor:not-allowed;}
    .hero-strip{background:linear-gradient(135deg,#FF6B35,#ff9166); border-radius:18px; color:#fff; padding:28px; display:flex; align-items:center; gap:18px;}
    .avatar-circle{width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-size:1.6rem; font-weight:700; flex-shrink:0;}
    .card-panel{background:#fff; border-radius:16px; padding:28px; box-shadow:0 4px 14px rgba(0,0,0,.05);}
    .form-label{font-weight:600; font-size:.85rem; color:#444;}
    .form-control{border-radius:10px; padding:10px 14px; border:1.5px solid #eee;}
    .form-control:focus{border-color:#FF6B35; box-shadow:0 0 0 3px rgba(255,107,53,.15);}
    .form-control:disabled, .form-control[readonly]{background:#f5f5f5; color:#999;}
    .section-title{font-weight:600; font-size:.95rem; color:#1c1c1e; display:flex; align-items:center; gap:8px; margin-bottom:16px;}
    .section-title i{color:#FF6B35;}
    .toast-msg{border-radius:12px; font-size:.9rem;}
    .divider{border-top:1px solid #f0f0f0; margin:28px 0;}
    .save-bar{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
    .strength-bar{height:5px; border-radius:5px; background:#eee; overflow:hidden; margin-top:6px;}
    .strength-fill{height:100%; width:0%; background:#eee; transition:.25s;}
    .field-hint{font-size:.78rem; color:#999; margin-top:4px;}
  </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3">
  <span class="navbar-brand brand fw-bold">Express<span>Meal</span></span>
  <div>
    <a th:href="@{/customer/dashboard}" class="btn btn-outline-light btn-sm rounded-pill me-2">
      <i class="bi bi-arrow-left"></i> Dashboard
    </a>
    <a th:href="@{/logout}" class="btn btn-orange btn-sm">Logout</a>
  </div>
</nav>

<div class="container my-4" style="max-width:760px;">

  <div class="hero-strip mb-4">
    <div class="avatar-circle" th:text="${#strings.isEmpty(customer.name) ? '?' : #strings.substring(customer.name,0,1)}"></div>
    <div>
      <h4 class="mb-1" th:text="${customer.name}"></h4>
      <p class="mb-0 opacity-75">Manage your personal details and password</p>
    </div>
  </div>

  <!-- Flash / status messages -->
  <div class="alert alert-success toast-msg d-flex align-items-center gap-2" th:if="${success}">
    <i class="bi bi-check-circle-fill"></i> <span th:text="${success}"></span>
  </div>
  <div class="alert alert-danger toast-msg d-flex align-items-center gap-2" th:if="${error}">
    <i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}"></span>
  </div>

  <div class="card-panel">
    <form th:action="@{/customer/profile}" method="post" id="profileForm" autocomplete="off">

      <div class="section-title"><i class="bi bi-person-fill"></i> Personal information</div>

      <div class="mb-3">
        <label class="form-label">Full name</label>
        <input type="text" name="name" class="form-control" th:value="${customer.name}" required>
      </div>

      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" th:value="${customer.email}" disabled readonly>
          <div class="field-hint">Email can't be changed here.</div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone</label>
          <input type="text" name="phone" class="form-control" th:value="${customer.phone}" placeholder="e.g. 07XXXXXXXX">
        </div>
      </div>

      <div class="mb-0 mt-3">
        <label class="form-label">Delivery address</label>
        <textarea name="address" class="form-control" rows="2" th:text="${customer.address}" placeholder="Your default delivery address"></textarea>
      </div>

      <div class="divider"></div>

      <div class="section-title"><i class="bi bi-shield-lock-fill"></i> Change password <span class="text-muted fw-normal" style="font-size:.78rem;">(optional)</span></div>

      <div class="mb-3">
        <label class="form-label">Current password</label>
        <div class="input-group">
          <input type="password" name="currentPassword" id="currentPassword" class="form-control" placeholder="Required only if setting a new password" autocomplete="new-password">
          <button type="button" class="btn btn-outline-secondary toggle-pw" data-target="currentPassword"><i class="bi bi-eye"></i></button>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">New password</label>
          <div class="input-group">
            <input type="password" name="newPassword" id="newPassword" class="form-control" placeholder="Leave blank to keep current" autocomplete="new-password">
            <button type="button" class="btn btn-outline-secondary toggle-pw" data-target="newPassword"><i class="bi bi-eye"></i></button>
          </div>
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Confirm new password</label>
          <div class="input-group">
            <input type="password" name="confirmPassword" id="confirmPassword" class="form-control" placeholder="Re-enter new password" autocomplete="new-password">
            <button type="button" class="btn btn-outline-secondary toggle-pw" data-target="confirmPassword"><i class="bi bi-eye"></i></button>
          </div>
          <div class="field-hint" id="matchHint"></div>
        </div>
      </div>

      <div class="save-bar">
        <a th:href="@{/customer/dashboard}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
        <button type="submit" class="btn btn-orange px-4" id="saveBtn">
          <i class="bi bi-check2"></i> Save changes
        </button>
      </div>
    </form>
  </div>
</div>

<script th:inline="javascript">
  // show/hide password fields
  document.querySelectorAll('.toggle-pw').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const icon = btn.querySelector('i');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
    });
  });

  // simple live password strength + match feedback, purely cosmetic (server still validates)
  const newPwd = document.getElementById('newPassword');
  const confirmPwd = document.getElementById('confirmPassword');
  const strengthFill = document.getElementById('strengthFill');
  const matchHint = document.getElementById('matchHint');

  function updateStrength() {
    const val = newPwd.value;
    let score = 0;
    if (val.length >= 4) score += 1;
    if (val.length >= 8) score += 1;
    if (/[0-9]/.test(val) && /[a-zA-Z]/.test(val)) score += 1;
    if (/[^a-zA-Z0-9]/.test(val)) score += 1;

    const colors = ['#eee', '#ff6b6b', '#ffb020', '#3ddc84', '#22c55e'];
    const widths = [0, 25, 50, 75, 100];
    strengthFill.style.width = widths[score] + '%';
    strengthFill.style.background = colors[score];
  }

  function updateMatch() {
    if (!confirmPwd.value) { matchHint.textContent = ''; return; }
    if (newPwd.value === confirmPwd.value) {
      matchHint.textContent = 'Passwords match ✓';
      matchHint.style.color = '#22c55e';
    } else {
      matchHint.textContent = "Passwords don't match";
      matchHint.style.color = '#ff6b6b';
    }
  }

  newPwd.addEventListener('input', () => { updateStrength(); updateMatch(); });
  confirmPwd.addEventListener('input', updateMatch);

  // prevent double-submit / give instant feedback on save
  document.getElementById('profileForm').addEventListener('submit', function () {
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Saving...';
  });

  // auto-dismiss success/error alerts after a few seconds
  document.querySelectorAll('.toast-msg').forEach(el => {
    setTimeout(() => { el.style.transition = 'opacity .4s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 400); }, 3500);
  });
</script>
</body>
</html>
