<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ExpressMeal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        *{font-family:'Poppins',sans-serif;}
        body{
            min-height:100vh; display:flex; align-items:center; justify-content:center;
            background:linear-gradient(135deg, rgba(20,20,22,.92), rgba(255,107,53,.65)),
            url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
            padding:20px;
        }
        .auth-card{background:rgba(255,255,255,.97); backdrop-filter:blur(8px); border-radius:22px; padding:40px; max-width:420px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,.25);}
        .form-control{border-radius:12px; padding:11px 14px; border:1.5px solid #eee;}
        .form-control:focus{border-color:#FF6B35; box-shadow:0 0 0 3px rgba(255,107,53,.15);}
        .btn-login{background:#FF6B35; border:none; color:#fff; font-weight:600; border-radius:50px; padding:12px; width:100%; transition:.2s;}
        .btn-login:hover{background:#e85a2a; color:#fff;}
        .brand{font-weight:800; text-align:center; margin-bottom:4px;}
        .brand span{color:#FF6B35;}
        .icon-circle{width:56px; height:56px; border-radius:50%; background:#fff0e8; color:#FF6B35; display:flex; align-items:center; justify-content:center; font-size:1.4rem; margin:0 auto 14px;}
    </style>
</head>
<body>
<div class="auth-card">
    <div class="icon-circle"><i class="bi bi-key-fill"></i></div>
    <h3 class="brand">Express<span>Meal</span></h3>
    <p class="text-center text-muted small mb-4">Enter the email on your account and we'll help you reset your password.</p>

    <form th:action="@{/forgot-password}" method="post" autocomplete="off">
        <div class="mb-4">
            <label class="form-label small fw-semibold">Registered email</label>
            <input type="email" name="email" class="form-control" required autocomplete="off" placeholder="you@example.com">
        </div>
        <button type="submit" class="btn-login">Send reset link</button>
    </form>

    <p class="text-center small mt-3 mb-0"><a th:href="@{/login}" style="color:#FF6B35; font-weight:600;"><i class="bi bi-arrow-left"></i> Back to login</a></p>
</div>
</body>
</html>
