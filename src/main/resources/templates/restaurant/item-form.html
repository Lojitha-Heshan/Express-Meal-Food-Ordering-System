<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Menu Item Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f7f5f2;">
<div class="container my-5" style="max-width:500px;">
    <h3 class="mb-4">Menu Item</h3>
    <form th:action="@{/restaurant/manage/save}" th:object="${item}" method="post" class="card p-4 shadow-sm">
        <input type="hidden" th:field="*{itemId}" />
        <div class="mb-3"><label class="form-label">Name</label><input class="form-control" th:field="*{name}" required></div>
        <div class="mb-3"><label class="form-label">Description</label><input class="form-control" th:field="*{description}"></div>
        <div class="mb-3"><label class="form-label">Price (Rs.)</label><input type="number" step="0.01" class="form-control" th:field="*{price}" required></div>
        <div class="mb-3"><label class="form-label">Category</label><input class="form-control" th:field="*{category}" placeholder="Rice, Short Eats, Drinks..."></div>
        <div class="mb-3">
            <label class="form-label">Image URL</label>
            <input class="form-control" th:field="*{imageUrl}" placeholder="https://example.com/photo.jpg">
            <small class="text-muted">Paste a link to an image (e.g. from Unsplash or Google Images).</small>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" th:field="*{available}">
            <label class="form-check-label">Available</label>
        </div>
        <button type="submit" class="btn btn-warning">Save</button>
    </form>
</div>
</body>
</html>
