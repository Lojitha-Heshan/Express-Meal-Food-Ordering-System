<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Menu - ExpressMeal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        *{font-family:'Poppins',sans-serif;}
        .navbar{background:#1C1C1E;}
        .brand span{color:#FF6B35;}
        .btn-orange{background:#FF6B35; border:none; color:#fff; border-radius:50px; font-weight:600; transition:.2s;}
        .btn-orange:hover{background:#e85a2a; color:#fff;}
        .card{border:none;border-radius:14px;} .card:hover{box-shadow:0 8px 18px rgba(0,0,0,.08); transition:.2s;}
        .qty-box{display:flex; align-items:center; border:1px solid #ddd; border-radius:8px; overflow:hidden;}
        .qty-box button{background:#f5f5f5; border:none; width:34px; height:34px; font-weight:600; font-size:1rem;}
        .qty-box input{border:none; width:44px; text-align:center; font-weight:600; -moz-appearance:textfield;}
        .qty-box input::-webkit-outer-spin-button, .qty-box input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
        .cat-pill.active{background:#FF6B35; color:#fff; border-color:#FF6B35;}
        .cat-pill{border-radius:50px;}
    </style>
</head>
<body style="background:#FFF8F2;">

<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand brand fw-bold"><a th:href="@{/}" class="text-decoration-none text-white">Express<span>Meal</span></a></span>
    <a th:href="@{/order/cart}" class="btn btn-orange btn-sm"><i class="bi bi-cart3"></i> Cart</a>
</nav>

<div class="container my-5">
    <h3 class="mb-3 fw-bold">Our Menu</h3>

    <div class="mb-4 d-flex flex-wrap gap-2">
        <a th:href="@{/restaurant/menu}"
           th:classappend="${selectedCategory == null} ? 'active' : ''"
           class="btn btn-sm btn-outline-dark cat-pill">All</a>
        <a th:each="cat : ${categories}"
           th:href="@{/restaurant/menu(category=${cat})}"
           th:text="${cat}"
           th:classappend="${selectedCategory == cat} ? 'active' : ''"
           class="btn btn-sm btn-outline-dark cat-pill"></a>
    </div>

    <div class="row g-4">
        <div class="col-md-4" th:each="item : ${items}">
            <div class="card h-100 shadow-sm">
                <img th:if="${item.imageUrl != null and !item.imageUrl.isEmpty()}"
                     th:src="${item.imageUrl}" class="card-img-top" style="height:160px; object-fit:cover; border-radius:14px 14px 0 0;">
                <div class="card-body">
                    <span class="badge bg-light text-dark mb-2" th:text="${item.category}"></span>
                    <h5 class="card-title" th:text="${item.name}"></h5>
                    <p class="card-text text-muted" th:text="${item.description}"></p>
                    <p class="fw-bold">Rs. <span th:text="${item.price}"></span></p>

                    <form th:action="@{/order/add/{id}(id=${item.itemId})}" method="post" class="d-flex align-items-center gap-2">
                        <div class="qty-box">
                            <button type="button" onclick="changeQty(this, -1)">−</button>
                            <input type="number" name="quantity" value="1" min="1" max="20" th:id="'qty-' + ${item.itemId}">
                            <button type="button" onclick="changeQty(this, 1)">+</button>
                        </div>
                        <button type="submit" class="btn btn-orange flex-grow-1"><i class="bi bi-plus-lg"></i> Add</button>
                    </form>
                </div>
            </div>
        </div>
        <p th:if="${items.isEmpty()}" class="text-muted">No menu items available yet.</p>
    </div>
</div>

<script>
    function changeQty(btn, delta) {
        const box = btn.closest('.qty-box');
        const input = box.querySelector('input[name=quantity]');
        let val = parseInt(input.value || '1', 10) + delta;
        if (val < 1) val = 1;
        if (val > 20) val = 20;
        input.value = val;
    }
</script>
</body>
</html>
