<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ExpressMeal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        *{font-family:'Poppins',sans-serif;}
        body{
            min-height:100vh; display:flex; align-items:center; justify-content:center;
            background:linear-gradient(135deg, rgba(20,20,22,.92), rgba(255,107,53,.65)),
            url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
            padding:20px;
        }
        .auth-card{background:rgba(255,255,255,.97); backdrop-filter:blur(8px); border-radius:22px; padding:40px; max-width:420px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,.25);}
        .form-control{border-radius:12px; padding:11px 14px; border:1.5px solid #eee;}
        .form-control:focus{border-color:#FF6B35; box-shadow:0 0 0 3px rgba(255,107,53,.15);}
        .btn-login{background:#FF6B35; border:none; color:#fff; font-weight:600; border-radius:50px; padding:12px; width:100%; transition:.2s;}
        .btn-login:hover{background:#e85a2a; color:#fff;}
        .brand{font-weight:800; text-align:center; margin-bottom:4px;}
        .brand span{color:#FF6B35;}
        .icon-circle{width:56px; height:56px; border-radius:50%; background:#fff0e8; color:#FF6B35; display:flex; align-items:center; justify-content:center; font-size:1.4rem; margin:0 auto 14px;}
        .icon-circle.bad{background:#fdecec; color:#dc3545;}
    </style>
</head>
<body>
<div class="auth-card" th:if="${valid}">
    <div class="icon-circle"><i class="bi bi-shield-lock-fill"></i></div>
    <h3 class="brand">Express<span>Meal</span></h3>
    <p class="text-center text-muted small mb-4">Choose a new password for your account.</p>

    <p th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></p>

    <form th:action="@{/reset-password}" method="post" autocomplete="off">
        <input type="hidden" name="token" th:value="${token}">
        <div class="mb-3">
            <label class="form-label small fw-semibold">New password</label>
            <input type="password" name="newPassword" class="form-control" required autocomplete="new-password">
            <small class="text-muted">At least 8 characters, with a number and a special character.</small>
        </div>
        <div class="mb-4">
            <label class="form-label small fw-semibold">Confirm new password</label>
            <input type="password" name="confirmPassword" class="form-control" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn-login">Reset password</button>
    </form>
</div>

<div class="auth-card text-center" th:unless="${valid}">
    <div class="icon-circle bad"><i class="bi bi-exclamation-triangle-fill"></i></div>
    <h3 class="brand">Express<span>Meal</span></h3>
    <p class="text-muted">This reset link is invalid or has expired.</p>
    <a th:href="@{/forgot-password}" class="btn-login d-inline-block text-decoration-none mt-2">Request a new link</a>
</div>
</body>
</html>
