<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Customers - ExpressMeal Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        *{font-family:'Poppins',sans-serif;}
        body{background:#FFF8F2;}
        .navbar{background:#1C1C1E;}
        .brand span{color:#FF6B35;}
        .btn-orange{background:#FF6B35; border:none; color:#fff; border-radius:50px; font-weight:600;}
        .btn-orange:hover{background:#e85a2a; color:#fff;}
        .card{border:none; border-radius:16px;}
        table thead{background:#FFF8F2;}
        .avatar-sm{width:36px; height:36px; border-radius:50%; background:#fff0e8; color:#FF6B35; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.85rem;}
        .search-box{border-radius:50px; padding:10px 18px;}
        .form-control:focus{border-color:#FF6B35; box-shadow:0 0 0 3px rgba(255,107,53,.15);}
    </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand brand fw-bold"><i class="bi bi-shield-lock-fill me-1"></i>Express<span>Meal</span> Admin</span>
    <div>
        <a th:href="@{/admin/dashboard}" class="btn btn-outline-light btn-sm rounded-pill me-2"><i class="bi bi-arrow-left"></i> Dashboard</a>
        <a th:href="@{/logout}" class="btn btn-orange btn-sm">Logout</a>
    </div>
</nav>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <div>
            <h3 class="mb-1">Customers</h3>
            <p class="text-muted mb-0" th:text="${customers.size()} + ' registered customers'"></p>
        </div>
        <a th:href="@{/admin/customers/new}" class="btn btn-orange"><i class="bi bi-plus-lg"></i> Add customer</a>
    </div>

    <div class="alert alert-success toast-msg" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger toast-msg" th:if="${error}" th:text="${error}"></div>

    <input type="text" id="searchBox" class="form-control search-box mb-3" placeholder="Search by name, email or phone...">

    <div class="card shadow-sm p-0">
        <div class="table-responsive">
            <table class="table align-middle mb-0" id="customerTable">
                <thead>
                <tr>
                    <th class="ps-4">Customer</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th class="text-center">Orders</th>
                    <th class="text-end">Total spent</th>
                    <th class="text-end pe-4">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${customers}">
                    <td class="ps-4">
                        <div class="d-flex align-items-center gap-2">
                            <div class="avatar-sm" th:text="${#strings.isEmpty(c.name) ? '?' : #strings.substring(c.name,0,1)}"></div>
                            <div>
                                <div class="fw-semibold" th:text="${c.name}"></div>
                                <div class="text-muted small" th:text="'#' + ${c.customerId}"></div>
                            </div>
                        </div>
                    </td>
                    <td th:text="${c.email}"></td>
                    <td th:text="${c.phone}"></td>
                    <td class="text-muted small" th:text="${c.address}"></td>
                    <td class="text-center" th:text="${orderCounts.get(c.customerId)}"></td>
                    <td class="text-end" th:text="'Rs. ' + ${totalSpent.get(c.customerId)}"></td>
                    <td class="text-end pe-4">
                        <a th:href="@{/admin/customers/view/{id}(id=${c.customerId})}" class="btn btn-sm btn-outline-secondary" title="View"><i class="bi bi-eye"></i></a>
                        <a th:href="@{/admin/customers/edit/{id}(id=${c.customerId})}" class="btn btn-sm btn-outline-primary" title="Edit"><i class="bi bi-pencil"></i></a>
                        <form th:action="@{/admin/customers/delete/{id}(id=${c.customerId})}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this customer? This cannot be undone.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${customers.isEmpty()}">
                    <td colspan="7" class="text-center text-muted py-5">No customers registered yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.getElementById('searchBox').addEventListener('input', function () {
        const q = this.value.toLowerCase();
        document.querySelectorAll('#customerTable tbody tr').forEach(row => {
            row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
        });
    });
    document.querySelectorAll('.toast-msg').forEach(el => {
        setTimeout(() => { el.style.transition = 'opacity .4s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 400); }, 3500);
    });
</script>
</body>
</html>
