<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title th:text="${isNew} ? 'Add Customer - ExpressMeal Admin' : 'Edit Customer - ExpressMeal Admin'"></title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        *{font-family:'Poppins',sans-serif;}
        body{background:#FFF8F2;}
        .navbar{background:#1C1C1E;}
        .brand span{color:#FF6B35;}
        .btn-orange{background:#FF6B35; border:none; color:#fff; border-radius:50px; font-weight:600;}
        .btn-orange:hover{background:#e85a2a; color:#fff;}
        .card{border:none; border-radius:16px;}
        .form-control:focus{border-color:#FF6B35; box-shadow:0 0 0 3px rgba(255,107,53,.15);}
    </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand brand fw-bold"><i class="bi bi-shield-lock-fill me-1"></i>Express<span>Meal</span> Admin</span>
    <a th:href="@{/admin/customers}" class="btn btn-outline-light btn-sm rounded-pill"><i class="bi bi-arrow-left"></i> Customers</a>
</nav>

<div class="container my-5" style="max-width:520px;">
    <h3 class="mb-4" th:text="${isNew} ? 'Add new customer' : 'Edit customer'"></h3>

    <p th:if="${emailError}" class="alert alert-danger py-2 small" th:text="${emailError}"></p>
    <p th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></p>

    <div class="card p-4 shadow-sm">
        <!-- Create: POST /admin/customers/save (binds full Customer + validation incl. password rule) -->
        <form th:if="${isNew}" th:action="@{/admin/customers/save}" th:object="${customer}" method="post">
            <div class="mb-3">
                <label class="form-label">Full name</label>
                <input type="text" class="form-control" th:field="*{name}" required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" th:field="*{email}" required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" th:field="*{password}" required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                <small class="text-muted">At least 8 characters, with a number and a special character.</small>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" class="form-control" th:field="*{phone}" placeholder="10 digits">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Address</label>
                <textarea class="form-control" rows="2" th:field="*{address}"></textarea>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/admin/customers}" class="btn btn-outline-secondary flex-grow-1">Cancel</a>
                <button type="submit" class="btn btn-orange flex-grow-1"><i class="bi bi-check2"></i> Add customer</button>
            </div>
        </form>

        <!-- Edit: POST /admin/customers/update/{id} - no password field (admin doesn't reset it here) -->
        <form th:unless="${isNew}" th:action="@{/admin/customers/update/{id}(id=${customer.customerId})}" method="post" id="editCustomerForm" novalidate>
            <div class="mb-3">
                <label class="form-label">Full name</label>
                <input type="text" name="name" class="form-control" th:value="${customer.name}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" th:value="${customer.email}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" name="phone" id="editPhoneInput" class="form-control" th:value="${customer.phone}" placeholder="9-15 digits">
                <div class="field-hint" id="editPhoneHint" style="font-size:.78rem; margin-top:4px;"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Address</label>
                <textarea name="address" class="form-control" rows="2" th:text="${customer.address}"></textarea>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/admin/customers}" class="btn btn-outline-secondary flex-grow-1">Cancel</a>
                <button type="submit" class="btn btn-orange flex-grow-1" id="editSaveBtn"><i class="bi bi-check2"></i> Save changes</button>
            </div>
        </form>
    </div>
</div>
<script th:if="${!isNew}">
    const editPhoneInput = document.getElementById('editPhoneInput');
    const editPhoneHint = document.getElementById('editPhoneHint');

    function checkEditPhone() {
        const val = editPhoneInput.value.trim();
        if (!val) { editPhoneHint.textContent = ''; editPhoneInput.classList.remove('is-invalid'); return true; }
        const valid = /^[0-9]{9,15}$/.test(val);
        editPhoneHint.textContent = valid ? 'Looks good ✓' : 'Digits only, 9-15 numbers.';
        editPhoneHint.style.color = valid ? '#198754' : '#dc3545';
        editPhoneInput.classList.toggle('is-invalid', !valid);
        return valid;
    }
    editPhoneInput.addEventListener('input', checkEditPhone);

    document.getElementById('editCustomerForm').addEventListener('submit', function (e) {
        if (!checkEditPhone()) { e.preventDefault(); return; }
        const btn = document.getElementById('editSaveBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Saving...';
    });
</script>
</body>
</html>
