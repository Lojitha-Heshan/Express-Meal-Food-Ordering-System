<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Admin Dashboard - ExpressMeal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        *{font-family:'Poppins',sans-serif;}
        body{background:#f6f5fa;}
        .navbar{background:#1c1c1e;}
        .brand span{color:#8b5cf6;}
        .card{border:none; border-radius:16px;}
        .metric{background:#fff; border-radius:16px; padding:24px; text-align:center; box-shadow:0 4px 16px rgba(0,0,0,.05);}
        .metric h2{color:#8b5cf6; font-weight:700;}
        .manage-card{background:#fff; border-radius:16px; padding:24px; box-shadow:0 4px 16px rgba(0,0,0,.05); transition:.25s; display:block; text-decoration:none; color:#1c1c1e;}
        .manage-card:hover{transform:translateY(-4px); box-shadow:0 12px 26px rgba(139,92,246,.18); color:#1c1c1e;}
        .manage-icon{width:52px; height:52px; border-radius:14px; background:linear-gradient(135deg,#8b5cf6,#a78bfa); display:flex; align-items:center; justify-content:center; color:#fff; font-size:1.4rem; margin-bottom:12px;}
        .btn-purple{background:#8b5cf6; border:none; color:#fff; border-radius:50px; font-weight:600;}
        .btn-purple:hover{background:#7c3aed; color:#fff;}
    </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand brand fw-bold"><i class="bi bi-shield-lock-fill me-1"></i>Express<span>Meal</span> Admin</span>
    <a th:href="@{/logout}" class="btn btn-purple btn-sm">Logout</a>
</nav>

<div class="container my-5">
    <div class="row g-3 mb-4">
        <div class="col-md-3 col-6"><div class="metric"><p class="text-muted small mb-1">Total orders</p><h2 th:text="${totalOrders}"></h2></div></div>
        <div class="col-md-3 col-6"><div class="metric"><p class="text-muted small mb-1">Total revenue</p><h2>Rs. <span th:text="${totalRevenue}"></span></h2></div></div>
    </div>

    <h5 class="mb-3">Manage ExpressMeal</h5>
    <div class="row g-4">
        <div class="col-md-4">
            <a th:href="@{/restaurant/manage}" class="manage-card">
                <div class="manage-icon"><i class="bi bi-egg-fried"></i></div>
                <h6>Menu items</h6><p class="text-muted small mb-0">Add, edit or remove dishes.</p>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/delivery/list}" class="manage-card">
                <div class="manage-icon"><i class="bi bi-truck"></i></div>
                <h6>Deliveries</h6><p class="text-muted small mb-0">Assign riders, track status.</p>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/delivery/riders}" class="manage-card">
                <div class="manage-icon"><i class="bi bi-people-fill"></i></div>
                <h6>Riders</h6><p class="text-muted small mb-0">Register and manage riders.</p>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/payment/reports}" class="manage-card">
                <div class="manage-icon"><i class="bi bi-graph-up-arrow"></i></div>
                <h6>Sales report</h6><p class="text-muted small mb-0">Revenue and payment history.</p>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/feedback/list}" class="manage-card">
                <div class="manage-icon"><i class="bi bi-star-fill"></i></div>
                <h6>Feedback</h6><p class="text-muted small mb-0">Customer ratings and reviews.</p>
            </a>
        </div>
    </div>
</div>
</body>
</html>
