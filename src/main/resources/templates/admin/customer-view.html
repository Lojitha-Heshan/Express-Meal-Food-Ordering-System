<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title th:text="${customer.name} + ' - ExpressMeal Admin'"></title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        *{font-family:'Poppins',sans-serif;}
        body{background:#FFF8F2;}
        .navbar{background:#1C1C1E;}
        .brand span{color:#FF6B35;}
        .btn-orange{background:#FF6B35; border:none; color:#fff; border-radius:50px; font-weight:600;}
        .btn-orange:hover{background:#e85a2a; color:#fff;}
        .card{border:none; border-radius:16px;}
        .hero-strip{background:linear-gradient(135deg,#FF6B35,#ff9166); border-radius:18px; color:#fff; padding:28px; display:flex; align-items:center; gap:18px;}
        .avatar-circle{width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-size:1.6rem; font-weight:700; flex-shrink:0;}
        .info-row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #f0f0f0; font-size:.9rem;}
        .info-row:last-child{border-bottom:none;}
        .badge-status{border-radius:30px; padding:5px 12px; font-weight:600; font-size:.72rem;}
    </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand brand fw-bold"><i class="bi bi-shield-lock-fill me-1"></i>Express<span>Meal</span> Admin</span>
    <div>
        <a th:href="@{/admin/customers}" class="btn btn-outline-light btn-sm rounded-pill me-2"><i class="bi bi-arrow-left"></i> Customers</a>
        <a th:href="@{/logout}" class="btn btn-orange btn-sm">Logout</a>
    </div>
</nav>

<div class="container my-5" style="max-width:900px;">
    <div class="hero-strip mb-4">
        <div class="avatar-circle" th:text="${#strings.isEmpty(customer.name) ? '?' : #strings.substring(customer.name,0,1)}"></div>
        <div class="flex-grow-1">
            <h4 class="mb-1" th:text="${customer.name}"></h4>
            <p class="mb-0 opacity-75" th:text="'Customer #' + ${customer.customerId}"></p>
        </div>
        <a th:href="@{/admin/customers/edit/{id}(id=${customer.customerId})}" class="btn btn-light btn-sm"><i class="bi bi-pencil"></i> Edit</a>
    </div>

    <div class="row g-4">
        <div class="col-md-5">
            <div class="card p-4 shadow-sm h-100">
                <h6 class="mb-3">Contact details</h6>
                <div class="info-row"><span class="text-muted">Email</span><span th:text="${customer.email}"></span></div>
                <div class="info-row"><span class="text-muted">Phone</span><span th:text="${customer.phone}"></span></div>
                <div class="info-row"><span class="text-muted">Address</span><span class="text-end" th:text="${customer.address}"></span></div>
                <div class="info-row"><span class="text-muted">Total orders</span><span th:text="${orders.size()}"></span></div>
                <div class="info-row">
                    <span class="text-muted">Total spent</span>
                    <span th:text="'Rs. ' + ${totalSpent}"></span>
                </div>
            </div>
        </div>
        <div class="col-md-7">
            <div class="card p-4 shadow-sm h-100">
                <h6 class="mb-3">Order history</h6>
                <div class="table-responsive">
                    <table class="table table-sm align-middle">
                        <thead><tr><th>Order #</th><th>Date</th><th>Total</th><th>Status</th></tr></thead>
                        <tbody>
                        <tr th:each="o : ${orders}">
                            <td th:text="'#' + ${o.orderId}"></td>
                            <td th:text="${#temporals.format(o.createdAt, 'dd MMM yyyy')}"></td>
                            <td th:text="'Rs. ' + ${o.totalAmount}"></td>
                            <td><span class="badge-status bg-light text-dark" th:text="${o.status}"></span></td>
                        </tr>
                        <tr th:if="${orders.isEmpty()}"><td colspan="4" class="text-center text-muted py-4">No orders yet.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
