<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ExpressMeal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        *{font-family:'Poppins',sans-serif;}
        :root{--orange:#FF6B35;}
        body{
            min-height:100vh; display:flex; align-items:center; justify-content:center;
            background:linear-gradient(135deg, rgba(20,20,22,.92), rgba(255,107,53,.65)),
            url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
            padding:20px;
        }
        .auth-card{background:rgba(255,255,255,.97); backdrop-filter:blur(8px); border-radius:22px; padding:40px; max-width:420px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,.25);}
        .role-tabs{display:flex; background:#f1f1f1; border-radius:50px; padding:4px; margin-bottom:24px;}
        .role-tabs label{flex:1; text-align:center; padding:9px 4px; border-radius:50px; font-size:.85rem; font-weight:600; color:#777; cursor:pointer; transition:.2s;}
        .role-tabs input{display:none;}
        .role-tabs input:checked + label{background:#FF6B35; color:#fff;}
        .form-control{border-radius:12px; padding:11px 14px; border:1.5px solid #eee;}
        .form-control:focus{border-color:#FF6B35; box-shadow:0 0 0 3px rgba(255,107,53,.15);}
        .btn-login{background:#FF6B35; border:none; color:#fff; font-weight:600; border-radius:50px; padding:12px; width:100%; transition:.2s;}
        .btn-login:hover{background:#e85a2a; color:#fff;}
        .brand{font-weight:800; text-align:center; margin-bottom:4px;}
        .brand span{color:#FF6B35;}
    </style>
</head>
<body>
<div class="auth-card">
    <h3 class="brand">Express<span>Meal</span></h3>
    <p class="text-center text-muted small mb-4">Login to continue</p>

    <p th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></p>

    <form th:action="@{/login}" method="post" autocomplete="off">
        <div class="role-tabs">
            <input type="radio" name="role" id="rCustomer" value="CUSTOMER" th:checked="${role == null or role == 'CUSTOMER'}">
            <label for="rCustomer"><i class="bi bi-person-fill d-block mb-1"></i>Customer</label>
            <input type="radio" name="role" id="rRider" value="RIDER" th:checked="${role == 'RIDER'}">
            <label for="rRider"><i class="bi bi-bicycle d-block mb-1"></i>Rider</label>
            <input type="radio" name="role" id="rAdmin" value="ADMIN" th:checked="${role == 'ADMIN'}">
            <label for="rAdmin"><i class="bi bi-shield-lock-fill d-block mb-1"></i>Admin</label>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold" id="idLabel">Email</label>
            <input type="text" name="identifier" class="form-control" required autocomplete="off">
        </div>
        <div class="mb-4">
            <label class="form-label small fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn-login">Login</button>
    </form>

    <p class="text-center small mt-3 mb-0">New customer? <a href="#" th:href="@{/customer/register}" style="color:#FF6B35; font-weight:600;">Sign up</a></p>
    <p class="text-center small text-muted mt-2 mb-0" style="font-size:.75rem;">Riders and admin accounts are created by ExpressMeal.</p>
</div>

<script>
    const labels = { CUSTOMER: 'Email', RIDER: 'Phone number', ADMIN: 'Admin username' };

    function updateLabelFromChecked() {
        const checked = document.querySelector('input[name=role]:checked');
        if (checked) {
            document.getElementById('idLabel').innerText = labels[checked.value];
        }
    }

    document.querySelectorAll('input[name=role]').forEach(r => {
        r.addEventListener('change', updateLabelFromChecked);
    });

    // Run once on page load too, in case a role was preselected by the server (th:checked)
    updateLabelFromChecked();
</script>
</body>
</html>
