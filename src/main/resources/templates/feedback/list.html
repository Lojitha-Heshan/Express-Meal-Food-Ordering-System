<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Customer Feedback - ExpressMeal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        *{font-family:'Poppins',sans-serif;}
        body{background:#FFF8F2;}
        .navbar{background:#1C1C1E;}
        .brand span{color:#FF6B35;}
        .btn-orange{background:#FF6B35; border:none; color:#fff; border-radius:50px; font-weight:600;}
        .btn-orange:hover{background:#e85a2a; color:#fff;}
        .card{border:none; border-radius:16px; box-shadow:0 4px 16px rgba(0,0,0,.05);}
        .nav-tabs .nav-link{color:#666; font-weight:600; border:none; border-bottom:3px solid transparent;}
        .nav-tabs .nav-link.active{color:#FF6B35; border-bottom-color:#FF6B35; background:transparent;}
    </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand brand fw-bold"><i class="bi bi-star-fill me-1"></i>Express<span>Meal</span></span>
    <div>
        <a th:href="@{/customer/dashboard}" class="btn btn-outline-light btn-sm rounded-pill me-2"><i class="bi bi-arrow-left"></i> Dashboard</a>
        <a th:href="@{/logout}" class="btn btn-orange btn-sm">Logout</a>
    </div>
</nav>

<div class="container my-5">
    <h3 class="mb-2">Customer Feedback</h3>
    <p th:if="${success}" class="alert alert-success py-2 small toast-msg" th:text="${success}"></p>
    <p th:if="${info}" class="alert alert-info py-2 small" th:text="${info}"></p>
    <p th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></p>
    <p class="text-muted">Average rating: <strong th:text="${#numbers.formatDecimal(averageRating, 1, 1)} + ' / 5'"></strong></p>

    <ul class="nav nav-tabs mb-4" th:if="${showTabs}">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${filter == 'all'} ? 'active'" th:href="@{/feedback/list(filter='all')}">All reviews</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${filter == 'mine'} ? 'active'" th:href="@{/feedback/list(filter='mine')}">My reviews</a>
        </li>
    </ul>

    <!-- Admin view: filter by rating using the Strategy pattern (HighRatingFilterStrategy / LowRatingFilterStrategy) -->
    <ul class="nav nav-tabs mb-4" th:unless="${showTabs}">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${filter == 'all'} ? 'active'" th:href="@{/feedback/list(filter='all')}">All reviews</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${filter == 'mine'} ? 'active'" th:href="@{/feedback/list(filter='mine')}">My reviews</a>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${filter == 'high'} ? 'active'" th:href="@{/feedback/list(filter='high')}">⭐ High rated (4-5)</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${filter == 'low'} ? 'active'" th:href="@{/feedback/list(filter='low')}">⚠️ Low rated (1-2)</a>
        </li>
    </ul>

    <div class="row g-3">
        <div class="col-md-4" th:each="f : ${feedbackList}">
            <div class="card p-4 h-100 d-flex flex-column">
                <p class="mb-2" th:text="${'⭐'.repeat(f.rating)}"></p>
                <p class="text-muted flex-grow-1" th:text="${f.comment}"></p>
                <small class="text-muted mb-2 fw-semibold" th:text="${f.customer != null ? f.customer.name : 'Anonymous'}"></small>
                <div th:if="${f.customer != null and loggedInCustomerId != null and f.customer.customerId == loggedInCustomerId}"
                     class="d-flex gap-2">
                    <a th:href="@{/feedback/edit/{id}(id=${f.feedbackId})}" class="btn btn-sm btn-outline-primary flex-grow-1 rounded-pill">Edit</a>
                    <a th:href="@{/feedback/delete/{id}(id=${f.feedbackId})}" class="btn btn-sm btn-outline-danger flex-grow-1 rounded-pill"
                       onclick="return confirm('Delete this feedback?');">Delete</a>
                </div>
            </div>
        </div>
        <p th:if="${feedbackList.isEmpty() and filter == 'mine'}" class="text-muted py-4">You haven't left any feedback yet.</p>
        <p th:if="${feedbackList.isEmpty() and filter == 'all'}" class="text-muted py-4">No feedback yet.</p>
    </div>
</div>
<script>
    document.querySelectorAll('.toast-msg').forEach(el => {
        setTimeout(() => { el.style.transition = 'opacity .4s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 400); }, 3500);
    });
</script>
</body>
</html>
