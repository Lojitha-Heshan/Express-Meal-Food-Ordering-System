<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Customer Feedback - QuickBite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f7f5f2;">
<div class="container my-5">
    <h3 class="mb-2">Customer Feedback</h3>
    <p class="text-muted">Average rating: <strong th:text="${#numbers.formatDecimal(averageRating, 1, 1)} + ' / 5'"></strong></p>
    <div class="row g-3">
        <div class="col-md-4" th:each="f : ${feedbackList}">
            <div class="card p-3 shadow-sm">
                <p class="mb-1" th:text="${'⭐'.repeat(f.rating)}"></p>
                <p class="text-muted" th:text="${f.comment}"></p>
                <small class="text-muted" th:text="${f.customer != null ? f.customer.name : 'Anonymous'}"></small>
            </div>
        </div>
        <p th:if="${feedbackList.isEmpty()}" class="text-muted">No feedback yet.</p>
    </div>
</div>
</body>
</html>
