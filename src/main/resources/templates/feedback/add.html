<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Leave Feedback - QuickBite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f7f5f2;">
<div class="container my-5" style="max-width:450px;">
    <div class="card p-4 shadow-sm">
        <h4 class="mb-3">Rate Your Order #<span th:text="${order.orderId}"></span></h4>
        <form th:action="@{/feedback/save}" method="post">
            <input type="hidden" name="orderId" th:value="${order.orderId}" />
            <label class="form-label">Rating</label>
            <select name="rating" class="form-select mb-3">
                <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
                <option value="4">⭐⭐⭐⭐ Good</option>
                <option value="3">⭐⭐⭐ Average</option>
                <option value="2">⭐⭐ Poor</option>
                <option value="1">⭐ Very Poor</option>
            </select>
            <label class="form-label">Comment</label>
            <textarea name="comment" class="form-control mb-3" rows="3" placeholder="Tell us about your experience..."></textarea>
            <button type="submit" class="btn btn-warning w-100">Submit Feedback</button>
        </form>
    </div>
</div>
</body>
</html>
