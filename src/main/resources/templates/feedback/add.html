<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Leave Feedback - ExpressMeal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        *{font-family:'Poppins',sans-serif;}
        body{background:#FFF8F2;}
        .navbar{background:#1C1C1E;}
        .brand span{color:#FF6B35;}
        .btn-orange{background:#FF6B35; border:none; color:#fff; border-radius:50px; font-weight:600;}
        .btn-orange:hover{background:#e85a2a; color:#fff;}
        .card{border:none; border-radius:16px; box-shadow:0 4px 16px rgba(0,0,0,.05);}
        .form-control:focus, .form-select:focus{border-color:#FF6B35; box-shadow:0 0 0 3px rgba(255,107,53,.15);}
    </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand brand fw-bold"><i class="bi bi-star-fill me-1"></i>Express<span>Meal</span></span>
    <a th:href="@{/customer/dashboard}" class="btn btn-outline-light btn-sm rounded-pill"><i class="bi bi-arrow-left"></i> Dashboard</a>
</nav>

<div class="container my-5" style="max-width:480px;">
    <div class="card p-4">
        <h4 class="mb-3">Rate Your Order #<span th:text="${order.orderId}"></span></h4>
        <p th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></p>
        <form th:action="@{/feedback/save}" method="post" id="feedbackForm" novalidate>
            <input type="hidden" name="orderId" th:value="${order.orderId}" />
            <label class="form-label small fw-semibold">Rating</label>
            <select name="rating" class="form-select mb-3" required>
                <option value="">Select a rating...</option>
                <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
                <option value="4">⭐⭐⭐⭐ Good</option>
                <option value="3">⭐⭐⭐ Average</option>
                <option value="2">⭐⭐ Poor</option>
                <option value="1">⭐ Very Poor</option>
            </select>
            <div class="invalid-feedback d-block mb-2" id="ratingError" style="display:none; font-size:.8rem; color:#dc3545; margin-top:-8px;">Please select a rating.</div>
            <label class="form-label small fw-semibold">Comment</label>
            <textarea name="comment" id="commentInput" class="form-control mb-1" rows="3" minlength="3" maxlength="500" placeholder="Tell us about your experience..." required></textarea>
            <div class="d-flex justify-content-between mb-4">
                <div id="commentError" style="display:none; font-size:.8rem; color:#dc3545;">Please write at least 3 characters.</div>
                <small class="text-muted ms-auto" id="commentCount">0/500</small>
            </div>
            <button type="submit" class="btn btn-orange w-100" id="submitBtn">Submit Feedback</button>
        </form>
    </div>
</div>

<script>
    const feedbackForm = document.getElementById('feedbackForm');
    const ratingSelect = feedbackForm.querySelector('select[name=rating]');
    const commentInput = document.getElementById('commentInput');
    const ratingError = document.getElementById('ratingError');
    const commentError = document.getElementById('commentError');
    const commentCount = document.getElementById('commentCount');

    commentInput.addEventListener('input', () => {
        commentCount.textContent = commentInput.value.length + '/500';
    });

    feedbackForm.addEventListener('submit', function (e) {
        let valid = true;

        if (!ratingSelect.value) {
            ratingError.style.display = 'block';
            valid = false;
        } else {
            ratingError.style.display = 'none';
        }

        if (commentInput.value.trim().length < 3) {
            commentError.style.display = 'block';
            valid = false;
        } else {
            commentError.style.display = 'none';
        }

        if (!valid) {
            e.preventDefault();
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Submitting...';
    });
</script>
</body>
</html>
