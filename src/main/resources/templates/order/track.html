<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Track Order - ExpressMeal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        *{font-family:'Poppins',sans-serif;}
        body{background:#FFF8F2;}
        .navbar{background:#1C1C1E;}
        .brand span{color:#FF6B35;}
        .btn-orange{background:#FF6B35; border:none; color:#fff; border-radius:50px; font-weight:600;}
        .btn-orange:hover{background:#e85a2a; color:#fff;}
        .card{border:none; border-radius:16px; box-shadow:0 4px 16px rgba(0,0,0,.05);}
        .steps{list-style:none; padding:0; margin:0;}
        .steps li{padding:10px 0 10px 30px; position:relative; color:#aaa;}
        .steps li.done{color:#198754; font-weight:600;}
        .steps li::before{content:"●"; position:absolute; left:0;}
    </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand brand fw-bold"><i class="bi bi-geo-alt-fill me-1"></i>Express<span>Meal</span></span>
    <a th:href="@{/customer/dashboard}" class="btn btn-outline-light btn-sm rounded-pill"><i class="bi bi-arrow-left"></i> Dashboard</a>
</nav>

<div class="container my-5" style="max-width:500px;">
    <div class="card p-4">
        <h4 class="mb-1">Order #<span th:text="${order.orderId}"></span></h4>
        <p class="small text-muted mb-3">
            Delivering to: <span th:text="${order.deliveryAddress}"></span>
        </p>

        <div th:if="${delivery != null and delivery.rider != null}" class="bg-light rounded-3 p-3 mb-3 small">
            <p class="mb-1"><i class="bi bi-bicycle text-warning"></i> Rider: <strong th:text="${delivery.rider.name}"></strong></p>
            <p class="mb-0"><i class="bi bi-telephone-fill text-warning"></i> <span th:text="${delivery.rider.phoneNumber}"></span></p>
        </div>

        <!-- Leaflet Map Container -->
        <div id="customer-map"
             th:data-address="${order.deliveryAddress}"
             style="width: 100%; height: 220px; border-radius: 12px; z-index: 1;"
             class="mb-3"></div>

        <ul class="steps mb-4">
            <li class="done">Order Placed</li>
            <li th:classappend="${delivery != null and delivery.rider != null} ? 'done'">Assigned to Rider</li>
            <li th:classappend="${delivery != null and (delivery.deliveryStatus == 'PICKED_UP' or delivery.deliveryStatus == 'IN_TRANSIT' or delivery.deliveryStatus == 'DELIVERED')} ? 'done'">Picked Up</li>
            <li th:classappend="${delivery != null and (delivery.deliveryStatus == 'IN_TRANSIT' or delivery.deliveryStatus == 'DELIVERED')} ? 'done'">In Transit</li>
            <li th:classappend="${delivery != null and delivery.deliveryStatus == 'DELIVERED'} ? 'done'">Delivered</li>
        </ul>

        <!-- Original Leave Feedback button restored -->
        <a th:href="@{/feedback/add/{id}(id=${order.orderId})}" class="btn btn-orange w-100">Leave Feedback</a>

        <!-- View Receipt button (from zip track.html) -->
        <a th:href="@{/order/receipt/{id}(id=${order.orderId})}" class="btn btn-outline-secondary mt-2 w-100"><i class="bi bi-receipt"></i> View Receipt</a>

    </div>
</div>


<!-- Leaflet JS Library -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        var mapElement = document.getElementById('customer-map');
        if (mapElement) {
            var rawAddress = mapElement.getAttribute('data-address') || '';

            var map = L.map('customer-map').setView([7.8731, 80.7718], 8);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            if (rawAddress) {
                var cleanAddress = rawAddress.split('|')[0]
                    .replace(/Mathle/gi, 'Matale')
                    .replace(/[0-9]+\/[0-9]+/g, '')
                    .replace(/[0-9]{4,5}/g, '')
                    .trim();

                function searchMap(query) {
                    return fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query + ', Sri Lanka'))
                        .then(res => res.json());
                }

                searchMap(cleanAddress).then(data => {
                    if (data && data.length > 0) {
                        showMarker(data[0].lat, data[0].lon, cleanAddress);
                    } else {
                        var parts = cleanAddress.split(',');
                        var city = parts[parts.length - 1].trim() || parts[0].trim();
                        searchMap(city).then(cityData => {
                            if (cityData && cityData.length > 0) {
                                showMarker(cityData[0].lat, cityData[0].lon, cleanAddress);
                            }
                        });
                    }
                }).catch(err => console.error(err));

                function showMarker(lat, lon, label) {
                    var latitude = parseFloat(lat);
                    var longitude = parseFloat(lon);
                    map.setView([latitude, longitude], 13);
                    L.marker([latitude, longitude]).addTo(map)
                        .bindPopup('<b>Delivery Address:</b><br>' + label)
                        .openPopup();
                }
            }
        }
    });
</script>
</body>
</html>
