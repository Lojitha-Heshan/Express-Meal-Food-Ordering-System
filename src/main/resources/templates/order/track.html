<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Track Order - ExpressMeal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        *{font-family:'Poppins',sans-serif;}
        body{background:#f7f5f2;}
        .steps{list-style:none;padding:0;}
        .steps li{padding:10px 0 10px 30px;position:relative;color:#aaa;}
        .steps li.done{color:#198754;font-weight:600;}
        .steps li::before{content:"●";position:absolute;left:0;}
        .btn-orange{background:#FF6B35; border:none; color:#fff; border-radius:50px; font-weight:600;}
        .btn-orange:hover{background:#e85a2a; color:#fff;}
    </style>
</head>
<body>
<div class="container my-5" style="max-width:500px;">
    <div class="card p-4 shadow-sm" style="border:none; border-radius:16px;">
        <h4>Order #<span th:text="${order.orderId}"></span></h4>
        <p class="text-muted" th:text="'Delivering to: ' + ${order.deliveryAddress}"></p>

        <div th:if="${delivery != null and delivery.rider != null}" class="bg-light rounded-3 p-3 mb-3 small">
            <p class="mb-1"><i class="bi bi-bicycle text-primary"></i> Rider: <strong th:text="${delivery.rider.name}"></strong></p>
            <p class="mb-0"><i class="bi bi-telephone-fill text-primary"></i> <span th:text="${delivery.rider.phoneNumber}"></span></p>
        </div>

        <ul class="steps" th:if="${delivery != null}">
            <li class="done">Order Placed</li>
            <li th:classappend="${delivery.deliveryStatus == 'ASSIGNED' or delivery.deliveryStatus == 'PICKED_UP' or delivery.deliveryStatus == 'IN_TRANSIT' or delivery.deliveryStatus == 'DELIVERED'} ? 'done'">Assigned to Rider</li>
            <li th:classappend="${delivery.deliveryStatus == 'PICKED_UP' or delivery.deliveryStatus == 'IN_TRANSIT' or delivery.deliveryStatus == 'DELIVERED'} ? 'done'">Picked Up</li>
            <li th:classappend="${delivery.deliveryStatus == 'IN_TRANSIT' or delivery.deliveryStatus == 'DELIVERED'} ? 'done'">In Transit</li>
            <li th:classappend="${delivery.deliveryStatus == 'DELIVERED'} ? 'done'">Delivered</li>
        </ul>

        <ul class="steps" th:if="${delivery == null}">
            <li class="done">Order Placed</li>
            <li>Waiting to be assigned to a rider</li>
        </ul>

        <a th:if="${delivery != null and delivery.deliveryStatus == 'DELIVERED'}" th:href="@{/feedback/add/{id}(id=${order.orderId})}" class="btn btn-orange mt-2">Leave Feedback</a>
    </div>
</div>
</body>
</html>
