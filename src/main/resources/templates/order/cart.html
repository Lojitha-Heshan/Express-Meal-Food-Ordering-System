<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your Cart - ExpressMeal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f7f5f2;">
<nav class="navbar navbar-dark px-4" style="background:#1f1f1f;">
    <a class="navbar-brand" th:href="@{/}">🍔 ExpressMeal</a>
    <a th:href="@{/restaurant/menu}" class="btn btn-outline-light btn-sm">← Back to Menu</a>
</nav>

<div class="container my-5">
    <h3 class="mb-4">Your Cart 🛒</h3>

    <table class="table bg-white shadow-sm rounded" th:if="${!cartItems.isEmpty()}">
        <thead class="table-light"><tr><th>Item</th><th>Price</th><th>Qty</th><th>Subtotal</th><th></th></tr></thead>
        <tbody>
        <tr th:each="entry : ${cartItems}">
            <td th:text="${entry.key.name}"></td>
            <td th:text="${entry.key.price}"></td>
            <td th:text="${entry.value}"></td>
            <td th:text="${entry.key.price * entry.value}"></td>
            <td><a th:href="@{/order/remove/{id}(id=${entry.key.itemId})}" class="btn btn-sm btn-outline-danger">Remove</a></td>
        </tr>
        </tbody>
    </table>

    <p th:if="${cartItems.isEmpty()}" class="text-muted">Your cart is empty. <a th:href="@{/restaurant/menu}">Browse the menu</a>.</p>

    <div th:if="${!cartItems.isEmpty()}" class="card p-4 shadow-sm mt-4" style="max-width:500px;">
        <h5>Total: Rs. <span th:text="${total}"></span></h5>
        <form th:action="@{/order/checkout}" method="post" class="mt-3">
            <label class="form-label">Delivery Address</label>
            <input type="text" name="deliveryAddress" class="form-control mb-3" required placeholder="Enter your delivery address">
            <button type="submit" class="btn btn-warning w-100">Proceed to Checkout</button>
        </form>
    </div>
</div>
</body>
</html>
