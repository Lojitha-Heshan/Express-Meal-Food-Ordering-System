<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Receipt - ExpressMeal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        *{font-family:'Poppins',sans-serif;}
        body{background:#FFF8F2;}
        .card{border:none; border-radius:18px; box-shadow:0 8px 24px rgba(0,0,0,.06);}
        .btn-orange{background:#FF6B35; border:none; color:#fff; border-radius:50px; font-weight:600;}
        .btn-orange:hover{background:#e85a2a; color:#fff;}
        @media print { .no-print { display:none !important; } body { background:#fff !important; } }
    </style>
</head>
<body>
<div class="container my-5" style="max-width:480px;">
    <div class="card p-4">
        <h4 class="fw-bold mb-1">Order Receipt</h4>
        <p class="text-muted small mb-3">Order #<span th:text="${receipt.orderId}"></span> - <span th:text="${receipt.status}"></span></p>
        <hr>
        <p class="mb-1"><strong th:text="${receipt.customerName}"></strong></p>
        <p class="text-muted small mb-3" th:if="${receipt.deliveryAddress}" th:text="${receipt.deliveryAddress}"></p>

        <p class="small mb-1" th:each="line : ${receipt.lineItems}" th:text="${line}"></p>
        <hr>
        <div class="d-flex justify-content-between small text-muted">
            <span>Subtotal</span><span>Rs. <span th:text="${receipt.subtotal}"></span></span>
        </div>
        <div class="d-flex justify-content-between small text-muted" th:if="${receipt.deliveryFee > 0}">
            <span>Delivery Fee</span><span>Rs. <span th:text="${receipt.deliveryFee}"></span></span>
        </div>
        <div class="d-flex justify-content-between small text-muted" th:if="${receipt.processingFee > 0}">
            <span>Card Processing Fee</span><span>Rs. <span th:text="${receipt.processingFee}"></span></span>
        </div>
        <hr>
        <div class="d-flex justify-content-between fw-bold fs-5">
            <span>Total</span><span>Rs. <span th:text="${receipt.grandTotal}"></span></span>
        </div>
        <p class="text-muted small mt-2" th:if="${receipt.paymentMethod}">Paid via <span th:text="${receipt.paymentMethod}"></span></p>

        <div class="no-print mt-4 d-flex gap-2">
            <button onclick="window.print()" class="btn btn-orange btn-sm flex-grow-1"><i class="bi bi-printer"></i> Print</button>
            <a th:href="@{/order/track/{id}(id=${receipt.orderId})}" class="btn btn-outline-secondary btn-sm flex-grow-1">Back</a>
        </div>
    </div>
</div>
</body>
</html>
