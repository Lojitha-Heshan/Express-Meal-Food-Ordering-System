<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order History - QuickBite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f7f5f2;">
<div class="container my-5">
    <h3 class="mb-4">Order History</h3>
    <table class="table bg-white shadow-sm rounded">
        <thead class="table-light"><tr><th>Order #</th><th>Total</th><th>Status</th><th></th></tr></thead>
        <tbody>
        <tr th:each="o : ${orders}">
            <td th:text="${o.orderId}"></td>
            <td th:text="${o.totalAmount}"></td>
            <td th:text="${o.status}"></td>
            <td><a th:href="@{/order/track/{id}(id=${o.orderId})}" class="btn btn-sm btn-outline-dark">Track</a></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
