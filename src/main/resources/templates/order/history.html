<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Order History - ExpressMeal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        *{font-family:'Poppins',sans-serif;}
        body{background:#FFF8F2;}
        .navbar{background:#1C1C1E;}
        .brand span{color:#FF6B35;}
        .btn-orange{background:#FF6B35; border:none; color:#fff; border-radius:50px; font-weight:600;}
        .btn-orange:hover{background:#e85a2a; color:#fff;}
        .card{border:none; border-radius:16px;}
        .badge-status{border-radius:30px; padding:6px 14px; font-weight:600; font-size:.75rem;}
        .st-PENDING{background:#fff3cd; color:#997404;}
        .st-CONFIRMED{background:#cfe2ff; color:#084298;}
        .st-PREPARING{background:#e2d9f3; color:#59359a;}
        .st-OUT_FOR_DELIVERY{background:#d1e7dd; color:#0f5132;}
        .st-DELIVERED{background:#d1e7dd; color:#0f5132;}
        .st-CANCELLED{background:#f8d7da; color:#842029;}
    </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand brand fw-bold">Express<span>Meal</span></span>
    <div>
        <a th:href="@{/customer/dashboard}" class="btn btn-outline-light btn-sm rounded-pill me-2"><i class="bi bi-arrow-left"></i> Dashboard</a>
        <a th:href="@{/logout}" class="btn btn-orange btn-sm">Logout</a>
    </div>
</nav>

<div class="container my-5">
    <h3 class="mb-4">Order History</h3>
    <p th:if="${success}" class="alert alert-success py-2 small" th:text="${success}"></p>
    <p th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></p>

    <div class="card shadow-sm p-0">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th class="ps-4">Order #</th><th>Total</th><th>Status</th><th class="pe-4 text-end">Actions</th></tr></thead>
                <tbody>
                <tr th:each="o : ${orders}">
                    <td class="ps-4 fw-semibold" th:text="'#' + ${o.orderId}"></td>
                    <td th:text="'Rs. ' + ${o.totalAmount}"></td>
                    <td><span class="badge-status" th:classappend="'st-' + ${o.status}" th:text="${o.status}"></span></td>
                    <td class="pe-4 text-end">
                        <a th:href="@{/order/track/{id}(id=${o.orderId})}" class="btn btn-sm btn-outline-dark rounded-pill">Track</a>
                        <form th:if="${o.status == 'PENDING' or o.status == 'CONFIRMED'}"
                              th:action="@{/order/cancel/{id}(id=${o.orderId})}" method="post" class="d-inline"
                              onsubmit="return confirm('Cancel this order? This cannot be undone.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill">Cancel</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${orders.isEmpty()}"><td colspan="4" class="text-center text-muted py-5">No orders yet.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
